name: CI/CD Pipeline

on:
  push:
    branches:
      - main   # Change if your default branch is not "main"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u XamOps --password-stdin

      # Build Docker image
      - name: Build Docker image
        run: docker build -t ghcr.io/xamops/image:latest .

      # Push Docker image
      - name: Push Docker image
        run: docker push ghcr.io/xamops/image:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io/xamops/image:latest
            docker stop XamOps-Live || true
            docker rm XamOps-Live || true
            docker run -d --name XamOps-Live -p 8080:8080 ghcr.io/xamops/image:latest
