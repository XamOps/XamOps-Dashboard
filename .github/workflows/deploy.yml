name: CI/CD - GHCR -> EC2 (self-hosted)

on:
  push:
    branches: [ "main" ]   # change if your default branch is different

jobs:
  build:
    runs-on: self-hosted   # your EC2 self-hosted runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build Docker image (Dockerfile at cloud/Dockerfile)
        env:
          IMAGE: ghcr.io/xamops/image
          TAG: ${{ github.sha }}
        run: |
          sudo docker build -t $IMAGE:$TAG -t $IMAGE:latest -f cloud/Dockerfile cloud

      - name: Push Docker image to GHCR
        env:
          IMAGE: ghcr.io/xamops/image
          TAG: ${{ github.sha }}
        run: |
          sudo docker push $IMAGE:$TAG
          sudo docker push $IMAGE:latest

  deploy:
    runs-on: self-hosted   # same EC2 runner
    needs: build
    steps:
      - name: Log in to GHCR (again, safe for separate job)
        run: echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Stop & remove existing container (if any)
        run: |
          sudo docker ps -aq --filter "name=^xamops-app$" | xargs -r sudo docker rm -f

      - name: Pull image and run new container
        env:
          IMAGE: ghcr.io/xamops/image
          TAG: ${{ github.sha }}
        run: |
          sudo docker pull $IMAGE:$TAG
          sudo docker run -d \
            --name xamops-app \
            --network xamops-uat-net \
            --restart always \
            -p 8080:8080 \
            --log-driver=awslogs \
            --log-opt awslogs-region=ap-south-1 \
            --log-opt awslogs-group=xamops-app-logs \
            --log-opt awslogs-stream=xamops-app \
            $IMAGE:$TAG
