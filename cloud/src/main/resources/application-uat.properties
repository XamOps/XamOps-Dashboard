# ===================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ===================================================================

# --- Production PostgreSQL Database ---
# Connects to the live database. Credentials can be overridden by environment variables.
spring.datasource.url=jdbc:postgresql://${DB_HOST:172.18.0.1}:${DB_PORT:5432}/${DB_NAME:xamops_db_uat}
spring.datasource.username=${DB_USER:app_user_uat}
spring.datasource.password=${DB_PASS:SecurePass123!}

# --- Production JPA/Hibernate & Logging ---
# ⚠️ CRITICAL: 'validate' prevents accidental changes to the live database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.springframework=INFO
logging.level.com.xammer.cloud=INFO
logging.level.software.amazon.awssdk=WARN
cors.allowed-origins=http://xamopsdev.xammer.in:8080,http://127.0.0.1:5500,https://uat.xamops.com

# --- Production API Keys ---
# 🔐 IMPORTANT: Load secrets from environment variables.
gemini.api.key=${GEMINI_API_KEY:AIzaSyDUHXg5yf3PrWdtvrHOhHQ9t5QKihoeCVA}

cloudformation.template.s3.url=https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-readonly-role.yml